name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm trusted publishing (OIDC): no NPM_TOKEN secret to store or rotate.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, newer than some Node 24 bundles.
      - run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepack builds, prepublishOnly runs the tests. Prereleases (v1.2.0-beta.0) go to the
      # `next` dist-tag so `npm install -g easy-diff` keeps resolving to the latest stable.
      - run: npm publish ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
